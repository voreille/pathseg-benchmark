# Med-NCA, IGNITE single task, Variant A (benchmark protocol).
# Copied from configs/semantic_two_heads_refactored.yaml; every change is
# logged in experiments/mednca/README.md ("Deviations from the baseline config").
trainer:
  precision: "bf16-mixed" # NCA iterates many steps; fp16 can diverge. Use "32-true" without bf16.
  max_steps: 40000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  accumulate_grad_batches: 1
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: pathseg-benchmark
      group: IGNITE
      job_type: baseline
      tags:
        - baseline
        - 20x
        - 448x448
        - IGNITE
        - med_nca
        - CustomTransforms
      save_dir: ./wandb
      log_model: false
model:
  class_path: pathseg.training.semantic.SemanticTraining
  init_args:
    network:
      class_path: pathseg.models.architectures.med_nca.MedNCASegmenter
      init_args:
        num_classes_by_task:
          ignite: 16
        channel_n: 64
        hidden_size: 128
        steps: 64
        fire_rate: 0.5
        scale_factor: 4
        n_eval_runs: 1
        grad_checkpointing_every: 8 # tune with the peak-memory probe
    tasks:
      ignite:
        loss_name: cross_entropy_dice
        loss_weight: 1.0
        class_weights: null
    tiler:
      class_path: pathseg.training.tiler.GridPadTiler
      init_args:
        tile: 448
        stride: 224
        weighted_blend: true # or true
        pad_mode: "replicate" # optional; nice for images
        pad_value: 0.0
    lr: 1.0e-4
    weight_decay: 0.05
    poly_lr_decay_power: 0.9
    lr_multiplier_encoder: 1.0 # all Med-NCA parameters live in the encoder
    freeze_encoder: false
data:
  class_path: pathseg.datasets.multitask.MultiTaskConcatDataModule
  init_args:
    datasets:
      - name: IGNITE
        task_name: ignite
        root: /home/valentin/workspaces/pathseg-benchmark/data/fss/ignite
        images_subdir: images
        masks_subdir: masks_semantic
        split_csv: metadata.csv
        sampling_weight: 1.0
        fold: 0
    img_size: [448, 448]
    prefetch_factor: 4
    num_workers: 0
    batch_size: 16
    transforms:
      class_path: pathseg.datasets.transforms.CustomTransforms
      init_args:
        img_size: [448, 448]
        scale_range: [0.7, 1.4]
