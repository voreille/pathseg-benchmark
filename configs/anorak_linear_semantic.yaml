trainer:
  precision: "16-mixed"
  max_steps: 40000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  accumulate_grad_batches: 1

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: "pathseg-benchmark"
      group: ANORAK
      job_type: baseline
      tags:
        - baseline
        - shark
        - 20x
        - 448x448
        - ANORAK
        - Linear
      save_dir: ./wandb
      log_model: false

model:
  class_path: pathseg.training.linear_semantic.LinearSemantic
  init_args:
    freeze_encoder: false

    decoder_name: linear_decoder
    decoder_init_args:
      encoder_id: h0-mini

    tiler_name: grid_pad_tiler
    tiler_init_args:
      tile: 448
      stride: 224
      weighted_blend: true
      pad_mode: replicate
      pad_value: 0.0

data:
  class_path: pathseg.datasets.anorak.ANORAK
  init_args:
    root: /home/valentin/workspaces/pathseg-benchmark/data/fss/anorak
    img_size: [448, 448]
    prefetch_factor: 4
    num_workers: 0
    batch_size: 16
    fold: 0
    epoch_repeat: 30

    transforms:
      class_path: pathseg.datasets.transforms.CustomTransforms
      init_args:
        img_size: [448, 448]
        scale_range: [0.8, 1.2]