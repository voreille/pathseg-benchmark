trainer:
  precision: "16-mixed"
  max_steps: 40000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  accumulate_grad_batches: 1
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: pathseg-benchmark
      id: h0mini-896x896-20x-multitask-linear-decoder-unfrozen-fold0-3
      resume: never
      group: ANORAK
      job_type: baseline
      tags:
        - baseline
        - 20x
        - 896x896
        - ANORAK+IGNITE
        - multitask
        - linear_decoder
        - CustomTransforms
        - h0-mini
      save_dir: ./wandb
      log_model: false

model:
  class_path: pathseg.training.semantic.SemanticTraining
  init_args:
    # Adjust this import path to the location of the refactored Encoder.
    encoder_class_path: pathseg.models.encoder.Encoder
    encoder_init_args:
      encoder_id: h0-mini
      img_size: [896, 896]
      random_weights: false
      sub_norm: false

    decoder_name: linear
    decoder_init_args:
      bias: true

    # These names replace num_classes_a/b and source_id_a/b. Mixed training
    # batches supervise each head only on its matching source subset.
    tasks:
      - name: ignite
        num_classes: 16
        loss_weight: 1.0
        class_weights: null
        loss_name: cross_entropy_dice
      - name: anorak
        num_classes: 7
        source_id: 1
        loss_weight: 1.0
        class_weights: null
        loss_name: cross_entropy_dice

    # MultiTaskConcatDataModule returns validation loaders in dataset order.
    eval_task_names: [ignite, anorak]
    ignore_idx: 255
    img_size: [896, 896]

    # A 1x1 head emits 64x64 logits for 896x896 input with patch size 14.
    # This explicitly authorizes SemanticSegmenter to upsample to 896x896.
    # When false, any resolution mismatch raises immediately.
    upsample_logits: true
    interpolation_mode: bilinear

    tiler_name: grid_pad_tiler
    tiler_init_args:
      tile: 896
      stride: 448
      weighted_blend: true
      pad_mode: replicate
      pad_value: 0.0

    lr: 1.0e-4
    weight_decay: 0.05
    poly_lr_decay_power: 0.9
    lr_multiplier_encoder: 0.1
    freeze_encoder: false

data:
  class_path: pathseg.datasets.multitask.MultiTaskConcatDataModule
  init_args:
    datasets:
      - name: IGNITE
        task_name: ignite
        root: /home/valentin/workspaces/pathseg-benchmark/data/fss/ignite
        images_subdir: images
        masks_subdir: masks_semantic
        split_csv: metadata.csv
        sampling_weight: 1.0
        fold: 0
      - name: ANORAK
        task_name: anorak
        root: /home/valentin/workspaces/pathseg-benchmark/data/fss/anorak
        images_subdir: images
        masks_subdir: masks_semantic
        split_csv: split.csv
        sampling_weight: 1.0
        fold: 0
    img_size: [896, 896]
    prefetch_factor: 4
    num_workers: 0
    batch_size: 16
    transforms:
      class_path: pathseg.datasets.transforms.CustomTransforms
      init_args:
        img_size: [896, 896]
        scale_range: [0.7, 1.4]

