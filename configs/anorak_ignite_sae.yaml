trainer:
  precision: "16-mixed" # or "bf16-mixed" for uni2 or 16-mixed for h-optimus
  max_steps: 40000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  accumulate_grad_batches: 1
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: "pathseg-benchmark"
      group: ANORAK
      job_type: baseline
      tags:
        [
          "baseline",
          "20x",
          "896x896",
          "ANORAK+IGNITE",
          "multitask",
          "CustomTransforms",
          "h0-mini",
          "SAE"
        ]
      save_dir: ./wandb
      log_model: false # avoid artifact uploads in debug

model:
  class_path: pathseg.sae.topk_sae_lightning.TopKSAETraining
  init_args:
    encoder_id: h0-mini
    encoder_init_checkpoint_path: /home/valentin/workspaces/pathseg-benchmark/runs/checkpoints/nktrot62/epoch=26-step=40000.ckpt
    num_latents: 3072
    k: 32
    img_size: [896, 896]
    normalize_decoder: true
    freeze_encoder: true

    lr: 0.0003
    weight_decay: 0.0
    poly_lr_decay_power: 0.9
    lr_multiplier_encoder: 0.1

    tiler_name: grid_pad_tiler
    tiler_init_args:
      tile: 896
      stride: 448
      weighted_blend: true
      pad_mode: replicate
      pad_value: 0.0

data:
  class_path: pathseg.datasets.multitask.MultiTaskConcatDataModule
  init_args:
    datasets:
      - name: IGNITE
        root: /home/valentin/workspaces/pathseg-benchmark/data/fss/ignite
        images_subdir: "images"
        masks_subdir: "masks_semantic"
        split_csv: "metadata.csv"
        source_id: 0
        num_classes: 16
        sampling_weight: 1.0
      - name: ANORAK
        root: /home/valentin/workspaces/pathseg-benchmark/data/fss/anorak
        images_subdir: "images"
        masks_subdir: "masks_semantic"
        split_csv: "split.csv"
        source_id: 1
        num_classes: 7
        sampling_weight: 1.0
    fold: 0
    img_size: [896, 896]
    prefetch_factor: 4
    num_workers: 0
    batch_size: 16
    transforms:
      # class_path: pathseg.datasets.transforms.HistoTransforms
      class_path: pathseg.datasets.transforms.CustomTransforms
      init_args:
        img_size: [896, 896]
        scale_range: [0.7, 1.4]
        # hed_p: 0.3
        # hed_h_shift_limit: 0.02
        # hed_e_shift_limit: 0.02
        # hsv_p: 0.1
        # hsv_hue_shift_limit: 0.02
        # hsv_sat_scale_limit: 0.05
        # hsv_val_scale_limit: 0.05
        # max_brightness_delta: 16
        # max_contrast_factor: 0.15
