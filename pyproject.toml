[build-system]
requires = [
  "setuptools>=77",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "pathseg"
version = "0.1.0"
description = "Benchmarking vision foundation models for histopathology semantic segmentation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

authors = [
  { name = "Valentin Oreiller" },
]

dependencies = [
  # General utilities
  "click>=8.5,<9",
  "gitignore-parser==0.1.11",
  "jsonargparse[signatures]>=4.52,<5",

  # Scientific Python
  "numpy>=2.5,<3",
  "pandas>=3,<4",
  "scipy>=1.18,<2",
  "scikit-image>=0.26,<0.27",
  "matplotlib>=3.10,<4",

  # Deep learning
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "lightning>=2.6,<3",
  "timm>=1.0.29,<2",
  "transformers>=5.17,<6",

  # Experiment tracking
  "wandb>=0.30,<1",
]


[project.optional-dependencies]
parquet = [
  "pyarrow>=20",
]


[dependency-groups]
dev = [
  "debugpy>=1.8",
  "ipykernel>=6",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.12",
]


[project.scripts]
pathseg = "pathseg.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["pathseg*"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
