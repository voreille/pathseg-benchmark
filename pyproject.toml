[build-system]
requires = [
  "setuptools>=77",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "pathseg"
version = "0.1.0"
description = "Benchmarking vision foundation models for histopathology semantic segmentation; forked from https://github.com/tue-mps/benchmark-vfm-ss/"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

authors = [
  { name = "Valentin Oreiller" },
]

dependencies = [
  # General utilities
  "click>=8,<9",
  "gitignore-parser==0.1.11",
  "jsonargparse[signatures]>=4.27.7,<5",

  # Scientific Python
  "numpy>=2.0,<=2.4.3",
  "pandas>=2,<3",
  "scipy>=1.13,<2",
  "scikit-image>=0.25.2,<0.26",
  "matplotlib>=3.8,<4",

  # Deep learning
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "lightning>=2.2.1,<3",
  "timm>=1.0.3,<=1.0.25",
  "transformers>=4.51.1,<5",

  # Experiment tracking
  "wandb>=0.16.5,<1",
]


[project.optional-dependencies]
parquet = [
  "pyarrow>=12",
]

dev = [
  "ipykernel>=6.29,<8",
  "pre-commit>=3,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]


[project.scripts]
pathseg = "pathseg.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["pathseg*"]
